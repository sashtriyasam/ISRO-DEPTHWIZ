appId: com.depthwizard.desktop
productName: DepthWizard
copyright: Copyright © 2026 ISRO DepthWizard Team

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - electron/main.js
  - electron/main.cjs
  - electron/preload.js
  - electron/preload.cjs
  - "!node_modules/**/*"

extraResources:
  - from: scripts/
    to: scripts/
    filter:
      - "depthwiz_service.py"
      - "backend_bridge.py"
      - "setup_backend.bat"
      - "requirements.txt"
      - "provision_runtime.py"
      - "runtime_check.py"
  - from: src/depthwizard/
    to: src/depthwizard/
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  # Packaging metadata so setup_backend.bat can pip-install the engine.
  - from: pyproject.toml
    to: pyproject.toml
  - from: README.md
    to: README.md

win:
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DepthWizard
  uninstallDisplayName: DepthWizard

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Science

asar: true
asarUnpack:
  - scripts/**
