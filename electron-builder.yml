appId: com.depthwizard.desktop
productName: DepthWizard
copyright: Copyright © 2026 ISRO DepthWizard Team

directories:
  output: release
  buildResources: assets

files:
  - dist/**
  - electron/main.js
  - electron/main.cjs
  - electron/preload.js
  - electron/preload.cjs
  - "!node_modules/**/*"

extraResources:
  - from: scripts/
    to: scripts/
    filter:
      - "depthwiz_service.py"
      - "backend_bridge.py"
      - "setup_backend.bat"
      - "requirements.txt"
      - "runtime_check.py"
  - from: src/depthwizard/
    to: src/depthwizard/
  # Pinned upstream DA-V2 source (Apache-2.0, LICENSE included) and the
  # SHA-verified checkpoint. Both live in git-ignored locations populated
  # before packaging (see docs/final-ml-candidate.md provenance); the
  # service discovers them at runtime without any tracked-tree vendoring.
  - from: third_party/Depth-Anything-V2
    to: third_party/Depth-Anything-V2
  - from: checkpoints/depth_anything_v2_vits.pth
    to: checkpoints/depth_anything_v2_vits.pth

win:
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: DepthWizard
  uninstallDisplayName: DepthWizard

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Science

asar: true
asarUnpack:
  - scripts/**
